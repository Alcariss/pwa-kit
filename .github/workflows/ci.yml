name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Starter template builds against this kit
        run: |
          npm pack --pack-destination /tmp
          cd template
          npm pkg set "dependencies.@alcariss/pwa-kit=file:$(ls /tmp/alcariss-pwa-kit-*.tgz)"
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          VITE_API_URL_PRIMARY=https://api.example/notes VITE_AUTH_PROVIDERS=google,github npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-dist
